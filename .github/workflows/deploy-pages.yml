name: Deploy to GitHub Pages

# Production site (chimeraracingteam.com) deploys ONLY from main.
# Staging / feature / PR branches must never trigger this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Allow production deploy from main only
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Refusing deploy from ${{ github.ref }} — production Pages deploy is main-only."
            exit 1
          fi
          echo "Deploy guard passed for main."

  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
